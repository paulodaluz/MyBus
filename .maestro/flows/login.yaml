appId: com.paulodaluz.brazil.mybus
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: 'MyBus'
    timeout: 90000
- tapOn: 'Login'
- tapOn: 'Email'
- inputText: '${EMAIL}'
- hideKeyboard
- scrollUntilVisible:
    element: 'Senha'
    direction: DOWN
- tapOn: 'Senha'
- inputText: 'Testpass123'
- hideKeyboard
- scrollUntilVisible:
    element: 'Entrar'
    direction: DOWN
- tapOn: 'Entrar'
- runFlow: map-ready.yaml
